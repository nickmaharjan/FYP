name: Bug report
description: Report a reproducible problem using synthetic or sanitized information.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not attach real device extractions, case reports, personal data, or credentials. Use a synthetic example and sanitized logs only.
  - type: input
    id: version
    attributes:
      label: Project version or commit
      placeholder: Commit hash or release tag
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, Python version, and relevant tool versions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include only synthetic paths and sanitized output.
    validations:
      required: true
