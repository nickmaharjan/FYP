[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-df-automation"
version = "0.2.0"
description = "Local Android forensic evidence orchestration prototype"
requires-python = ">=3.10"

[project.scripts]
mobile-df = "mobile_df.cli:main"
mobile-df-desktop = "mobile_df.desktop:main"

[project.optional-dependencies]
forensics = ["yara-python==4.5.4", "mvt==2026.9.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mobile_df = ["static/*"]
